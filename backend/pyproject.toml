[project]
name = "supgeuk-war-backend"
version = "0.1.0"
description = "FastAPI backend for SUPGEUK WAR"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "asyncpg",
    "greenlet",
    "redis",
    "apscheduler",
    "pandas",
    "numpy",
    "pykrx==1.2.8",
    "finance-datareader",
    "pydantic-settings",
    "setuptools<81"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
